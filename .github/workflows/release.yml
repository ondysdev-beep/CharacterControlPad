# Release: push a tag "v*" (for example v0.14.0 or v0.14.0-beta) and this workflow
#   1. runs the offline test suite,
#   2. packages the CharacterControlPad folder with the BigWigs packager and uploads it to
#      CurseForge (project id from "## X-Curse-Project-ID" in the TOC; game version from
#      "## Interface: 16001" = WoW: Forever 1.60.1) and to a GitHub release.
# Tags containing "alpha" or "beta" are uploaded as alpha / beta files, other tags as release.
# Needs the repository secret CF_API_KEY (CurseForge API token).
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Offline tests
        run: |
          npm ci
          npm test

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        with:
          args: -t CharacterControlPad
